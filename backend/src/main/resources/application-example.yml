server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gallae?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # H2 인메모리 DB (application.yml 없을 때 fallback)
  h2:
    console:
      enabled: false

logging:
  level:
    com.gallae: DEBUG
    org.springframework.web: INFO

