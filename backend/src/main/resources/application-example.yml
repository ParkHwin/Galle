server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gallae?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: YOUR_DB_USERNAME
    password: YOUR_DB_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # H2 인메모리 DB (application.yml 없을 때 fallback)
  h2:
    console:
      enabled: false

logging:
  level:
    com.gallae: DEBUG
    org.springframework.web: INFO

external:
  srt:
    base-url: https://api.odcloud.kr/api/15040160/v1/uddi:f4cca1a9-a1f1-4b7f-bf1c-a7dc600f0f2d
    service-key: YOUR_SRT_SERVICE_KEY    # https://www.data.go.kr

  korail:
    base-url: https://apis.data.go.kr/B551457/run/v2
    service-key: YOUR_KORAIL_SERVICE_KEY # https://www.data.go.kr

  bus:
    base-url: https://apis.data.go.kr/1613000/ExpBusInfo
    service-key: YOUR_BUS_SERVICE_KEY    # https://www.data.go.kr

  kakao:
    navi-base-url: https://apis-navi.kakaomobility.com
    api-key: YOUR_KAKAO_MOBILITY_API_KEY # https://developers.kakao.com
