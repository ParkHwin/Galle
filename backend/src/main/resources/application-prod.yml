spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile_nickname, profile_image, account_email
            client-name: Kakao
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            scope: name, email, profile_image
            client-name: Naver
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope: profile, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

logging:
  level:
    com.gallae: INFO
    org.springframework.web: WARN

external:
  srt:
    base-url: ${SRT_BASE_URL:https://api.odcloud.kr/api/15040160/v1/uddi:f4cca1a9-a1f1-4b7f-bf1c-a7dc600f0f2d}
    service-key: ${SRT_SERVICE_KEY}
  korail:
    base-url: ${KORAIL_BASE_URL:https://apis.data.go.kr/B551457/run/v2}
    service-key: ${KORAIL_SERVICE_KEY}
  bus:
    base-url: ${BUS_BASE_URL:https://apis.data.go.kr/1613000/ExpBusInfo}
    service-key: ${BUS_SERVICE_KEY}
  kakao:
    navi-base-url: ${KAKAO_NAVI_BASE_URL:https://apis-navi.kakaomobility.com}
    api-key: ${KAKAO_API_KEY}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  redirect-uri: ${FRONTEND_URL}/auth/callback
